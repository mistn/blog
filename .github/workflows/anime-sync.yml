name: Anime Sync

on:
  workflow_dispatch:
  schedule:
    # Every Monday 02:00 Asia/Shanghai
    - cron: "0 18 * * 0"

permissions:
  contents: write

concurrency:
  group: anime-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.12

      - name: Run sync unit tests
        run: node --test scripts/sync-anime.test.mjs

      - name: Sync AniList data
        env:
          ANILIST_USER_NAME: ${{ secrets.ANILIST_USER_NAME }}
          ALLOW_EMPTY_SYNC: ${{ vars.ALLOW_EMPTY_SYNC }}
          ALLOW_SHRINK_SYNC: ${{ vars.ALLOW_SHRINK_SYNC }}
          ALLOW_MISSING_ARCHIVE_LIST: ${{ vars.ALLOW_MISSING_ARCHIVE_LIST }}
          ALLOW_USER_CHANGE: ${{ vars.ALLOW_USER_CHANGE }}
        run: node ./scripts/sync-anime.mjs

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/anime.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize data snapshot
        shell: bash
        env:
          CHANGED: ${{ steps.changes.outputs.changed }}
        run: |
          node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('src/data/anime.generated.json','utf8')); const items=Array.isArray(data.items)?data.items:[]; const years=items.map(item=>item.year).filter(Boolean); const latest=years.length?Math.max(...years):'n/a'; const lines=['## Anime Sync Summary', '', '- Username: '+(data.username||'unknown'), '- Updated at: '+(data.updatedAt||'unknown'), '- Total titles: '+Number(items.length), '- Latest season year: '+latest, '- Changed in this run: '+(process.env.CHANGED||'unknown')]; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');"

      - name: No changes detected
        if: steps.changes.outputs.changed != 'true'
        run: echo "anime.generated.json is already up to date."

      - name: Commit updated anime data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/anime.generated.json
          git commit -m "chore(data): sync anime data"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            # Clear any half-finished rebase from the previous attempt.
            git rebase --abort >/dev/null 2>&1 || true

            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
              && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to push anime data after 3 attempts."
              exit 1
            fi

            sleep $((attempt * 5))
          done
